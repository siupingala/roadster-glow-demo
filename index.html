<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Roadster Glow Demo · Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; color: #eee; }
    #c { display: block; width: 100%; height: 100%; touch-action: none; position: relative; z-index: 1; }
    #cam {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      z-index: 0; background: #050508;
    }
    #cam.mirror { transform: scaleX(-1); }
    .hud {
      position: fixed; left: 0; right: 0; top: 0; z-index: 10;
      padding: calc(8px + env(safe-area-inset-top)) 6px 8px;
      background: linear-gradient(rgba(0,0,0,.78), transparent);
    }
    .row {
      display: flex; flex-wrap: nowrap; gap: 4px; justify-content: flex-start;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: 0 2px;
    }
    .row::-webkit-scrollbar { display: none; }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(8,8,10,.82);
      color: #f3f3f3;
      border-radius: 2px;
      padding: 5px 7px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
      min-height: 26px;
      transition: background .12s, border-color .12s, color .12s;
    }
    button:active { opacity: .85; }
    button.on {
      border-color: #c4a574;
      color: #f3e6cf;
      background: rgba(28, 22, 14, .92);
    }
    button.brake.on { border-color: #e85a5a; color: #ffd0d0; background: rgba(40,12,12,.92); }
    button.thrust.on { border-color: #7eb8e8; color: #d7ecff; background: rgba(10,28,44,.92); }
    button.cam.on { border-color: #8fdbb0; color: #d9ffe9; background: rgba(10,36,24,.92); }
    .tip {
      margin-top: 5px; text-align: center; font-size: 9px; opacity: .5;
      letter-spacing: .04em; text-transform: uppercase;
    }
    .badge {
      position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 12px;
      font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
      opacity: .5; z-index: 10; text-shadow: 0 1px 4px #000;
    }
    #status {
      position: fixed; bottom: calc(26px + env(safe-area-inset-bottom)); left: 12px;
      z-index: 10; font-size: 10px; opacity: .65; text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
    #gate {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); backdrop-filter: blur(6px); padding: 24px;
    }
    #gate.hidden { display: none; }
    #gate .card {
      max-width: 320px; text-align: center;
      background: rgba(12,12,14,.96); border: 1px solid rgba(255,255,255,.14);
      border-radius: 2px; padding: 22px 18px;
    }
    #gate h1 {
      font-size: 14px; margin-bottom: 8px; font-weight: 500;
      letter-spacing: .16em; text-transform: uppercase;
    }
    #gate p { font-size: 12px; opacity: .7; margin-bottom: 16px; line-height: 1.45; }
    #gate button { width: 100%; padding: 10px; font-size: 11px; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="c"></canvas>

  <div class="hud">
    <div class="row">
      <button type="button" id="btnCam" class="cam" aria-pressed="false">鏡頭</button>
      <button type="button" id="btnFlip" class="cam" aria-pressed="false">前後</button>
      <button type="button" id="btnHead" aria-pressed="false">頭燈</button>
      <button type="button" id="btnBrake" class="brake" aria-pressed="false">煞車</button>
      <button type="button" id="btnL" aria-pressed="false">←燈</button>
      <button type="button" id="btnR" aria-pressed="false">燈→</button>
      <button type="button" id="btnThrust" class="thrust" aria-pressed="false">Thrust</button>
      <button type="button" id="btnFly" class="thrust" aria-pressed="false">起飛</button>
      <button type="button" id="btnMute" aria-pressed="true">聲效</button>
      <button type="button" id="btnReset">重置</button>
    </div>
    <p class="tip">Drag to bank · W/S speed · Concept demo</p>
  </div>

  <div id="status">鏡頭未開</div>
  <div class="badge">Roadster Glow</div>

  <div id="gate">
    <div class="card">
      <h1>Roadster</h1>
      <p>開後鏡頭做實景背景。允許相機後，頂欄掣控制燈、thruster 同聲效。</p>
      <button type="button" id="btnStart" class="cam">開啟後鏡頭</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('c');
    const videoEl = document.getElementById('cam');
    const statusEl = document.getElementById('status');
    const gate = document.getElementById('gate');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 2.2, 6.6);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.15);
    key.position.set(4, 8, 6);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.45);
    rim.position.set(-6, 3, -4);
    scene.add(rim);

    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(1.28, 32),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.02;
    scene.add(shadow);

    const car = new THREE.Group();
    car.scale.set(0.8, 0.8, 0.8);
    scene.add(car);

    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc8cdd4, metalness: 0.92, roughness: 0.22 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x111114, metalness: 0.7, roughness: 0.4 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x1a222c, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.75 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.42, 4.2), bodyMat);
    body.position.y = 0.55; car.add(body);
    const nose = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.32, 1.1), bodyMat);
    nose.position.set(0, 0.48, 2.35); car.add(nose);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.38, 1.6), glassMat);
    cabin.position.set(0, 0.88, 0.15); car.add(cabin);
    const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.35), darkMat);
    spoiler.position.set(0, 0.95, -1.85); car.add(spoiler);
    const diffuser = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.22, 0.45), darkMat);
    diffuser.position.set(0, 0.28, -2.15); car.add(diffuser);

    function wheel(x, z) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.22, 24), darkMat);
      w.rotation.z = Math.PI / 2; w.position.set(x, 0.38, z); car.add(w);
    }
    wheel(-0.95, 1.35); wheel(0.95, 1.35); wheel(-0.95, -1.35); wheel(0.95, -1.35);

    function makeLightMesh(w, h, d, color) {
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0, metalness: 0.2, roughness: 0.4 });
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      m.userData.mat = mat; return m;
    }

    const headL = makeLightMesh(0.28, 0.1, 0.08, 0xfff2cc); headL.position.set(-0.55, 0.52, 2.88);
    const headR = makeLightMesh(0.28, 0.1, 0.08, 0xfff2cc); headR.position.set(0.55, 0.52, 2.88);
    car.add(headL, headR);
    const spotL = new THREE.SpotLight(0xfff1c8, 0, 18, Math.PI / 7, 0.45, 1);
    spotL.position.set(-0.55, 0.55, 2.9); spotL.target.position.set(-0.55, 0.2, 8);
    car.add(spotL, spotL.target);
    const spotR = new THREE.SpotLight(0xfff1c8, 0, 18, Math.PI / 7, 0.45, 1);
    spotR.position.set(0.55, 0.55, 2.9); spotR.target.position.set(0.55, 0.2, 8);
    car.add(spotR, spotR.target);

    const tailBar = makeLightMesh(1.7, 0.05, 0.06, 0xff2a2a); tailBar.position.set(0, 0.72, -2.12); car.add(tailBar);
    const brakeL = makeLightMesh(0.25, 0.12, 0.06, 0xff1a1a); brakeL.position.set(-0.7, 0.55, -2.12);
    const brakeR = makeLightMesh(0.25, 0.12, 0.06, 0xff1a1a); brakeR.position.set(0.7, 0.55, -2.12);
    car.add(brakeL, brakeR);

    const turnFL = makeLightMesh(0.16, 0.08, 0.06, 0xffaa33); turnFL.position.set(-0.92, 0.52, 2.7);
    const turnFR = makeLightMesh(0.16, 0.08, 0.06, 0xffaa33); turnFR.position.set(0.92, 0.52, 2.7);
    const turnRL = makeLightMesh(0.16, 0.08, 0.06, 0xffaa33); turnRL.position.set(-0.95, 0.62, -2.05);
    const turnRR = makeLightMesh(0.16, 0.08, 0.06, 0xffaa33); turnRR.position.set(0.95, 0.62, -2.05);
    car.add(turnFL, turnFR, turnRL, turnRR);

    const thrusters = [];
    [-0.45, -0.15, 0.15, 0.45].forEach((x) => {
      const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.28, 16), darkMat);
      nozzle.rotation.x = Math.PI / 2; nozzle.position.set(x, 0.32, -2.35); car.add(nozzle);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), new THREE.MeshBasicMaterial({ color: 0x9ad8ff, transparent: true, opacity: 0 }));
      glow.position.set(x, 0.32, -2.55); car.add(glow);
      const plume = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.9, 16, 1, true), new THREE.MeshBasicMaterial({ color: 0xb8e7ff, transparent: true, opacity: 0, side: THREE.DoubleSide }));
      plume.rotation.x = Math.PI; plume.position.set(x, 0.32, -2.95); car.add(plume);
      const pLight = new THREE.PointLight(0x8ecfff, 0, 4, 2); pLight.position.set(x, 0.35, -2.6); car.add(pLight);
      thrusters.push({ glow, plume, pLight });
    });

    const audio = {
      ctx: null, master: null, thrustNodes: null, enabled: true,
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = 0.35;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      beep(freq, dur, type = 'square', gain = 0.08) {
        if (!this.enabled) return;
        this.unlock();
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + dur + 0.02);
      },
      click() { this.beep(880, 0.04, 'square', 0.05); },
      brake() {
        if (!this.enabled) return;
        this.unlock();
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(140, t);
        o.frequency.exponentialRampToValueAtTime(55, t + 0.28);
        g.gain.setValueAtTime(0.07, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.32);
      },
      whoosh() {
        if (!this.enabled) return;
        this.unlock();
        const t = this.ctx.currentTime;
        const n = Math.floor(this.ctx.sampleRate * 0.45);
        const buffer = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const src = this.ctx.createBufferSource(); src.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(400, t);
        filter.frequency.exponentialRampToValueAtTime(2200, t + 0.35);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        src.connect(filter); filter.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + 0.5);
        this.beep(220, 0.25, 'sine', 0.04);
      },
      setThrust(on) {
        if (!this.enabled) {
          if (this.thrustNodes) { try { this.thrustNodes.osc.stop(); this.thrustNodes.osc2.stop(); } catch (_) {} this.thrustNodes = null; }
          return;
        }
        this.unlock();
        if (on && !this.thrustNodes) {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          const f = this.ctx.createBiquadFilter();
          osc.type = 'sawtooth'; osc.frequency.value = 55;
          osc2.type = 'square'; osc2.frequency.value = 58;
          f.type = 'lowpass'; f.frequency.value = 320;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.06, t + 0.2);
          osc.connect(f); osc2.connect(f); f.connect(g); g.connect(this.master);
          osc.start(); osc2.start();
          this.thrustNodes = { osc, osc2, g };
        } else if (!on && this.thrustNodes) {
          const t = this.ctx.currentTime;
          this.thrustNodes.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
          const nodes = this.thrustNodes;
          setTimeout(() => { try { nodes.osc.stop(); nodes.osc2.stop(); } catch (_) {} }, 200);
          this.thrustNodes = null;
        }
      }
    };

    const state = {
      headlights: false, brake: false, turnL: false, turnR: false,
      thrust: false, fly: false, _blinkWas: false,
      steer: 0, steerSmooth: 0, speed: 0, yaw: 0, bank: 0, height: 0, blink: 0,
      facingMode: 'environment', camOn: false,
    };

    let mediaStream = null;
    function setBtn(el, on) { el.classList.toggle('on', on); el.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    function setStatus(text) { statusEl.textContent = text; }

    async function startCamera(facingMode) {
      if (!navigator.mediaDevices?.getUserMedia) { setStatus('此瀏覽器唔支援相機'); throw new Error('no getUserMedia'); }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
      } catch (_) {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode } });
      }
      videoEl.srcObject = mediaStream;
      await videoEl.play();
      state.facingMode = facingMode; state.camOn = true;
      videoEl.classList.toggle('mirror', facingMode === 'user');
      setStatus(facingMode === 'user' ? '前鏡頭 · 實景' : '後鏡頭 · 實景');
      setBtn(btnCam, true); gate.classList.add('hidden');
    }

    function stopCamera() {
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      videoEl.srcObject = null; state.camOn = false; setBtn(btnCam, false); setStatus('鏡頭已關（黑底）');
    }

    const btnStart = document.getElementById('btnStart');
    const btnCam = document.getElementById('btnCam');
    const btnFlip = document.getElementById('btnFlip');
    const btnHead = document.getElementById('btnHead');
    const btnBrake = document.getElementById('btnBrake');
    const btnL = document.getElementById('btnL');
    const btnR = document.getElementById('btnR');
    const btnThrust = document.getElementById('btnThrust');
    const btnFly = document.getElementById('btnFly');
    const btnMute = document.getElementById('btnMute');
    const btnReset = document.getElementById('btnReset');
    setBtn(btnMute, true);

    btnStart.onclick = async () => { audio.unlock(); try { await startCamera('environment'); } catch (err) { setStatus('開鏡頭失敗：' + (err.message || err)); } };
    btnCam.onclick = async () => {
      audio.unlock();
      try { if (state.camOn) stopCamera(); else await startCamera(state.facingMode || 'environment'); }
      catch (err) { setStatus('開鏡頭失敗：' + (err.message || err)); }
    };
    btnFlip.onclick = async () => {
      audio.unlock();
      const next = state.facingMode === 'environment' ? 'user' : 'environment';
      try { await startCamera(next); setBtn(btnFlip, next === 'user'); audio.click(); }
      catch (_) { setStatus('切換鏡頭失敗（可能只有一個鏡頭）'); }
    };
    btnHead.onclick = () => { state.headlights = !state.headlights; setBtn(btnHead, state.headlights); audio.click(); };
    btnBrake.onclick = () => { state.brake = !state.brake; setBtn(btnBrake, state.brake); if (state.brake) audio.brake(); else audio.click(); };
    btnL.onclick = () => { state.turnL = !state.turnL; if (state.turnL) state.turnR = false; setBtn(btnL, state.turnL); setBtn(btnR, state.turnR); audio.beep(660, 0.06, 'square', 0.05); };
    btnR.onclick = () => { state.turnR = !state.turnR; if (state.turnR) state.turnL = false; setBtn(btnR, state.turnR); setBtn(btnL, state.turnL); audio.beep(720, 0.06, 'square', 0.05); };
    btnThrust.onclick = () => { state.thrust = !state.thrust; setBtn(btnThrust, state.thrust); audio.setThrust(state.thrust || state.fly); };
    btnFly.onclick = () => {
      state.fly = !state.fly;
      if (state.fly) { state.thrust = true; setBtn(btnThrust, true); audio.whoosh(); } else audio.click();
      setBtn(btnFly, state.fly); audio.setThrust(state.thrust || state.fly);
    };
    btnMute.onclick = () => {
      audio.enabled = !audio.enabled; setBtn(btnMute, audio.enabled);
      if (!audio.enabled) audio.setThrust(false); else { audio.unlock(); audio.setThrust(state.thrust || state.fly); audio.click(); }
    };
    btnReset.onclick = () => {
      Object.assign(state, { headlights: false, brake: false, turnL: false, turnR: false, thrust: false, fly: false, steer: 0, steerSmooth: 0, speed: 0, yaw: 0, bank: 0, height: 0 });
      car.position.set(0, 0, 0); car.rotation.set(0, 0, 0); shadow.position.set(0, 0.02, 0);
      [btnHead, btnBrake, btnL, btnR, btnThrust, btnFly].forEach(b => setBtn(b, false));
      audio.setThrust(false); audio.click();
    };

    const keys = {};
    addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    let dragging = false, lastX = 0;
    canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); audio.unlock(); });
    canvas.addEventListener('pointerup', () => { dragging = false; state.steer *= 0.3; });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX;
      state.steer = THREE.MathUtils.clamp(state.steer + dx * 0.004, -1, 1);
    });

    function setEmissive(mesh, intensity) { mesh.userData.mat.emissiveIntensity = intensity; }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      state.blink += dt;

      if (keys['arrowleft'] || keys['a']) state.steer = Math.max(state.steer - 1.8 * dt, -1);
      else if (keys['arrowright'] || keys['d']) state.steer = Math.min(state.steer + 1.8 * dt, 1);
      else if (!dragging) state.steer *= Math.pow(0.08, dt);

      if (keys['arrowup'] || keys['w']) state.speed = Math.min(state.speed + 4.5 * dt, 8);
      if (keys['arrowdown'] || keys['s'] || state.brake) state.speed = Math.max(state.speed - (state.brake ? 7 : 3.5) * dt, -2);
      else { state.speed *= Math.pow(0.35, dt); if (Math.abs(state.speed) < 0.02) state.speed = 0; }

      state.steerSmooth = THREE.MathUtils.damp(state.steerSmooth, state.steer, 4.5, dt);
      state.bank = THREE.MathUtils.damp(state.bank, -state.steerSmooth * 0.28, 3.2, dt);
      state.yaw += -state.steerSmooth * state.speed * 0.35 * dt;
      state.height = THREE.MathUtils.damp(state.height, state.fly ? 1.4 : 0, 2.2, dt);

      car.rotation.y = state.yaw;
      car.rotation.z = state.bank;
      car.rotation.x = state.fly ? -0.06 : THREE.MathUtils.damp(car.rotation.x, state.speed * 0.01, 3, dt);
      car.position.y = state.height;
      const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw);
      car.position.addScaledVector(forward, state.speed * dt);
      shadow.position.x = car.position.x; shadow.position.z = car.position.z;
      shadow.material.opacity = state.fly ? 0.12 : 0.35;

      const headI = state.headlights ? 3.2 : 0.05;
      setEmissive(headL, headI); setEmissive(headR, headI);
      spotL.intensity = state.headlights ? 2.8 : 0; spotR.intensity = state.headlights ? 2.8 : 0;
      const brakeI = state.brake ? 4.5 : (state.headlights ? 0.8 : 0.25);
      setEmissive(tailBar, brakeI * 0.85); setEmissive(brakeL, brakeI); setEmissive(brakeR, brakeI);

      const blinkOn = (state.blink % 0.7) < 0.35;
      if (!state._blinkWas && blinkOn && (state.turnL || state.turnR)) audio.beep(520, 0.03, 'square', 0.03);
      state._blinkWas = blinkOn;
      setEmissive(turnFL, state.turnL && blinkOn ? 3.5 : 0);
      setEmissive(turnRL, state.turnL && blinkOn ? 3.5 : 0);
      setEmissive(turnFR, state.turnR && blinkOn ? 3.5 : 0);
      setEmissive(turnRR, state.turnR && blinkOn ? 3.5 : 0);

      const thrustOn = state.thrust || state.fly;
      const pulse = 0.75 + 0.25 * Math.sin(state.blink * 18);
      thrusters.forEach(({ glow, plume, pLight }) => {
        glow.material.opacity = thrustOn ? 0.85 * pulse : 0;
        plume.material.opacity = thrustOn ? 0.45 * pulse : 0;
        plume.scale.y = thrustOn ? 0.9 + 0.35 * pulse : 0.2;
        pLight.intensity = thrustOn ? 2.2 * pulse : 0;
      });

      const camTarget = car.position.clone().add(new THREE.Vector3(0, 1.45 + state.height * 0.2, -5.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), state.yaw));
      camera.position.lerp(camTarget, 1 - Math.pow(0.001, dt));
      camera.lookAt(car.position.x, car.position.y + 0.55, car.position.z);
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    addEventListener('pagehide', stopCamera);
  </script>
</body>
</html>
